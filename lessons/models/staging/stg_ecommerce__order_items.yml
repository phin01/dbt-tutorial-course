models:
  - name: stg_ecommerce__order_items
    description: "Line items with details from orders"
    columns:
      - name: order_item_id
        description: "Unique identifier for each order item"
        tests:
          - primary_key

      - name: order_id
        description: "Identifier for the order to which this item belongs"
        tests:
          - not_null
          - relationships:
              to: ref('stg_ecommerce__orders')
              field: order_id

      - name: user_id
        description: "Identifier for the user who placed the order"
        tests:
          - not_null

      - name: product_id
        description: "Identifier for the product"
        tests:
          - not_null
          - relationships:
              to: ref('stg_ecommerce__products')
              field: product_id

      - name: item_sale_price
        description: "The price at which the item was sold"
        tests:
          - not_null